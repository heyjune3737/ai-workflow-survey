<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>내 반복 업무 설문 · AI 워크플로우</title><style>
  :root{--ink:#1c1a17;--sub:#5c574f;--line:#e6e1d8;--bg:#f6f2ec;--card:#fff;--accent:#b5482a;--accent-d:#963a20;--gold:#c08a2d;--green:#3f7d54;--shade:#f3efe7;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.65;font-size:16px;letter-spacing:-.01em;-webkit-text-size-adjust:100%;}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 60px;}
  header{background:linear-gradient(135deg,#2a1e18 0%,#5a2c1c 100%);color:#f7f2ea;padding:34px 0 30px;margin-bottom:22px;}
  header .wrap{padding-bottom:0;}
  header .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e6b98a;margin-bottom:10px;}
  header h1{font-size:25px;margin:0 0 10px;font-weight:800;line-height:1.3;}
  header p{margin:0;font-size:14.5px;color:#d8cdbf;}
  header .time{margin-top:14px;display:inline-block;font-size:12.5px;font-weight:700;background:rgba(240,168,110,.18);color:#f0a86e;border:1px solid #7a4a34;border-radius:100px;padding:4px 13px;}
  .step-label{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.03em;margin:26px 0 8px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.03);}
  h2{font-size:18px;margin:0 0 4px;font-weight:800;}
  .desc{font-size:13.5px;color:var(--sub);margin:0 0 16px;}
  label.f{display:block;font-size:13.5px;font-weight:700;margin:0 0 6px;color:var(--ink);}
  label.f .opt{font-weight:500;color:var(--sub);font-size:12px;}
  input[type=text],textarea,select{width:100%;font-family:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;background:#fdfcfa;transition:border-color .15s;-webkit-appearance:none;}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);}
  textarea{resize:vertical;min-height:56px;line-height:1.5;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field{margin-bottom:14px;}.field:last-child{margin-bottom:0;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{flex:1;min-width:60px;text-align:center;font-size:14px;font-weight:700;padding:10px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;color:var(--sub);user-select:none;transition:all .12s;}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .task{border:1.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;background:#fffdfb;position:relative;}
  .task .thead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .task .tnum{font-size:14px;font-weight:800;color:var(--accent);}
  .task .del{font-size:12.5px;color:var(--sub);background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px;cursor:pointer;}
  .task .del:hover{color:var(--accent);border-color:var(--accent);}
  .adv-toggle{display:flex;align-items:center;gap:9px;margin-top:14px;padding-top:13px;border-top:1px dashed var(--line);font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;user-select:none;}
  .adv-toggle input{width:18px;height:18px;accent-color:var(--accent);flex:none;}
  .adv-toggle .sub{font-weight:500;color:var(--sub);font-size:12.5px;}
  .adv{margin-top:12px;padding:15px;background:#faf5ef;border:1px solid #ecdccb;border-radius:12px;}
  .adv .ahead{font-size:12px;font-weight:800;color:var(--accent);margin:0 0 12px;letter-spacing:.02em;}
  .chips.typ .chip{font-size:13px;padding:9px 6px;min-width:56px;}
  .addbtn{width:100%;padding:13px;font-size:14.5px;font-weight:700;color:var(--accent);background:#fff;border:1.5px dashed var(--accent);border-radius:12px;cursor:pointer;}
  .addbtn:hover{background:#fff4ef;}
  .genbtn{width:100%;padding:16px;font-size:16.5px;font-weight:800;color:#fff;background:var(--accent);border:none;border-radius:14px;cursor:pointer;margin-top:8px;}
  .genbtn:hover{background:var(--accent-d);}
  #result{display:none;}#result.show{display:block;}
  .result-card{background:#fff;border:2px solid var(--green);border-radius:16px;padding:20px;margin-top:8px;}
  .result-card h2{color:var(--green);}
  #output{width:100%;min-height:240px;font-family:"SF Mono",Consolas,monospace;font-size:12.5px;line-height:1.55;background:#f7faf8;border:1px solid var(--line);border-radius:10px;padding:14px;color:#333;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
  .btns button{padding:13px;font-size:14.5px;font-weight:700;border-radius:11px;cursor:pointer;border:none;}
  .b-copy{background:var(--green);color:#fff;}.b-copy:hover{background:#356a47;}
  .b-down{background:#fff;color:var(--ink);border:1.5px solid var(--line)!important;}.b-down:hover{border-color:var(--green)!important;}
  .sendnote{background:#fff8f1;border:1px solid #e7d3bf;border-left:4px solid var(--accent);border-radius:10px;padding:13px 15px;margin-top:14px;font-size:13.5px;}
  .sendnote b{color:var(--accent);}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:#1c1a17;color:#fff;font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:100px;transition:all .25s;pointer-events:none;z-index:99;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .err{color:var(--accent);font-size:13px;font-weight:700;margin-top:10px;display:none;}.err.show{display:block;}
  #gate{max-width:420px;margin:8vh auto 0;padding:0 20px;text-align:center;}
  #gate .lock{width:58px;height:58px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
  #gate h2{font-size:20px;margin:0 0 6px;}
  #gate p{font-size:14px;color:var(--sub);margin:0 0 22px;}
  #gate .pwrow{display:flex;gap:8px;}
  #gate input{flex:1;font-size:16px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:#fff;}
  #gate input:focus{outline:none;border-color:var(--accent);}
  #gate button{padding:13px 20px;font-size:15px;font-weight:800;color:#fff;background:var(--accent);border:none;border-radius:12px;cursor:pointer;white-space:nowrap;}
  #gate button:hover{background:var(--accent-d);}
  #gate .gerr{color:var(--accent);font-size:13.5px;font-weight:700;margin-top:14px;min-height:20px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}header h1{font-size:21px;}}
</style></head><body>

  function build(){
